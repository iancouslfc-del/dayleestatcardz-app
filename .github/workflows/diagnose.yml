# Data check: shows exactly what PitchAPI holds for one team and one player,
# so the app's numbers can be compared with other sites. Run it from
# Actions → Data check → Run workflow. The report is saved on the
# "diagnostics" branch as report.txt.
name: Data check

on:
  workflow_dispatch:
    inputs:
      team:
        description: "Team name (part is fine, e.g. Celta)"
        required: false
        default: ""
      player:
        description: "Player name (part is fine, e.g. Moriba)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check the data
        env:
          PITCHAPI_KEY: ${{ secrets.PITCHAPI_KEY }}
          DIAG_TEAM: ${{ inputs.team }}
          DIAG_PLAYER: ${{ inputs.player }}
        run: node scripts/diagnose.mjs
      - name: Save the report
        run: |
          cd out-diag
          git init -q -b diagnostics
          git config user.name "dayleestatcardz-bot"
          git config user.email "actions@users.noreply.github.com"
          git add report.txt
          git commit -q -m "Data check $(date -u +%FT%TZ)"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" diagnostics
