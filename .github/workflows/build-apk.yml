# Builds the Android APK automatically on GitHub's free machines every time
# the code changes, and publishes it as a download on the repo's Releases page.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build the APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Name the file
        run: cp app/build/outputs/apk/release/app-release.apk DayleeStatCardz.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DayleeStatCardz-apk
          path: DayleeStatCardz.apk

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: DayleeStatCardz build ${{ github.run_number }}
          body: Tap DayleeStatCardz.apk below to download and install.
          files: DayleeStatCardz.apk
          make_latest: true
